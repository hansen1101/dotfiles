set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse off

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# set vi-mode
set-window-option -g mode-keys vi

# keybinding
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g @catppuccin_flavour "$CATPPUCCIN_FLAVOUR" # 'latte'
#set -g @catppuccin_directory_text "#{pane_current_path}"
#set -g @catppuccin_directory_text "#{b:pane_current_path}"
#set -g @catppuccin_directory_text "#{d:pane_current_path}"
#set -g @catppuccin_directory_text "#{s|/Users/hansen|~|:#{d:pane_current_path}}"
set -g @catppuccin_directory_text "#{s|/workspace/github.com|/<ws>|:#{s|/Users/hansen|~|:#{d:pane_current_path}}}"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W" # window application name

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W" # window application name

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
