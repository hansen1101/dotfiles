# GNOME desktop settings (no keyboard shortcuts - see gnome-shortcuts.ini)
# host=h97hd3  gnome=46.0  date=2026-09-08T09:56:52+02:00
# restore with: dconf load /org/gnome/ < gnome-desktop.ini

[mutter]
edge-tiling=false
workspaces-only-on-primary=true

[desktop/interface]
color-scheme='prefer-dark'
font-name='Ubuntu 11'
gtk-theme='Yaru-red-dark'
icon-theme='Yaru-red'

[desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[desktop/input-sources]
sources=[('xkb', 'us')]
xkb-options=@as []

[desktop/session]
idle-delay=uint32 300

[desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/Fuwafuwa_nanbatto_san_by_amaral-light.png'
primary-color='#000000'
secondary-color='#000000'

[desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/Fuwafuwa_nanbatto_san_by_amaral-light.png'
picture-uri-dark='file:///usr/share/backgrounds/Fuwafuwa_nanbatto_san_by_amaral-dark.png'
primary-color='#000000'
secondary-color='#000000'

[desktop/notifications]
application-children=['org-gnome-software', 'app-zen-browser-zen']
show-banners=false

[desktop/notifications/application/app-zen-browser-zen]
application-id='app.zen_browser.zen.desktop'

[desktop/notifications/application/org-gnome-software]
application-id='org.gnome.Software.desktop'

[shell]
enabled-extensions=['ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com']
favorite-apps=['brave-browser.desktop', 'app.zen_browser.zen.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'nvidia-settings.desktop', 'org.gnome.Settings.desktop', 'dev.zed.Zed.desktop', 'com.yubico.yubioath.desktop', 'org.keepassxc.KeePassXC.desktop']

[shell/extensions/dash-to-dock]
dock-position='BOTTOM'
multi-monitor=true

[shell/extensions/tiling-assistant]
active-window-hint-color='rgb(211,70,21)'
last-version-installed=46

[shell/world-clocks]
locations=@av []

[nautilus/list-view]
default-zoom-level='small'

[nautilus/preferences]
default-folder-viewer='list-view'
migrated-gtk-settings=true
search-filter-time-type='last_modified'

[settings-daemon/plugins/power]
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

