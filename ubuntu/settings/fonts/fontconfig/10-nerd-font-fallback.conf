<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Make Nerd Font icons available without changing the terminal font.

  The terminal keeps rendering text in whatever monospace font is configured;
  fontconfig only reaches for this font for codepoints the base font lacks,
  which is exactly the Nerd Font private-use ranges.

  "Nerd Font Mono" specifically: its icons occupy a single cell. The plain
  "Nerd Font" and "Nerd Font Propo" variants are wider than one cell and get
  clipped or push the grid out of alignment in TUIs such as lazygit.
-->
<fontconfig>
  <!-- append, so it is a fallback and never overrides the chosen font -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font Mono</string>
    </edit>
  </match>

  <!-- same for the concrete families Ubuntu resolves monospace to -->
  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu Sans Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font Mono</string>
    </edit>
  </match>

  <!-- prefer the single-cell Mono cut whenever a glyph is served from the
       Nerd Font family at large -->
  <match target="pattern">
    <test qual="any" name="family"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>JetBrainsMono Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
